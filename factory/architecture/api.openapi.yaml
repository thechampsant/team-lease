openapi: 3.1.0
info:
  title: Client API
  version: 0.1.0
  description: Written by the architect role before any implementation exists.
servers:
  - url: https://api.example.com/v1
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: health
      security: []   # public on purpose: load balancers call it without logging in
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
components:
  schemas: {}
